name: release

# A version tag on main runs the full CI job, then publishes to npm with provenance through trusted
# publishing; no token is stored (plan: Releases). docs/releasing.md describes the procedure.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: tag is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$GITHUB_REF_NAME is not on main."; exit 1; }
      - name: release gate
        run: node scripts/release-check.js "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile
      - name: check:build
        run: pnpm build

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install --global npm@11
      - run: npm publish --provenance --access public
